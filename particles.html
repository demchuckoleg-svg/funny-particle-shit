<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>particles</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden;touch-action:none;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;inset:0;display:block}
  #hint{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
    color:rgba(255,255,255,.32);font:500 11px/1.4 system-ui,-apple-system,sans-serif;letter-spacing:.28em;
    text-transform:uppercase;white-space:nowrap;pointer-events:none;transition:opacity 1.4s ease}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">tap · summon&nbsp;&nbsp;&nbsp;·&nbsp;&nbsp;&nbsp;drag · swirl</div>
<script>
'use strict';

const TAU = Math.PI * 2;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hint = document.getElementById('hint');

/* ---------- pre-rendered glow sprites, one per hue step ---------- */
const SPRITE_N = 48;
const sprites = [];
for (let i = 0; i < SPRITE_N; i++) {
  const hue = (i * 360 / SPRITE_N) | 0;
  const cv = document.createElement('canvas');
  cv.width = cv.height = 64;
  const g = cv.getContext('2d');
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0.00, `hsla(${hue},100%,74%,1)`);
  grad.addColorStop(0.22, `hsla(${hue},100%,62%,.55)`);
  grad.addColorStop(0.60, `hsla(${hue},100%,55%,.16)`);
  grad.addColorStop(1.00, `hsla(${hue},100%,50%,0)`);
  g.fillStyle = grad;
  g.fillRect(0, 0, 64, 64);
  sprites.push(cv);
}

/* ---------- particle pool ---------- */
const MAX = 420;
const parts = [];
for (let i = 0; i < MAX; i++) {
  parts.push({
    x: 0, y: 0, vx: 0, vy: 0, depth: 1,
    hueOff: (i / MAX) * 70 + Math.random() * 14,   // rainbow spread across the shape
    size: 1.3 + Math.random() * 2.1,
    pulse: Math.random() * TAU,
    wobA: 1.5 + Math.random() * 3.5,               // idle jitter amplitude
    wobF: 0.6 + Math.random() * 1.4,
    wobP: Math.random() * TAU,
    orbR: 4 + Math.random() * 34,                   // finger-vortex orbit
    orbA: Math.random() * TAU,
    orbS: (0.8 + Math.random() * 1.2) * (Math.random() < 0.5 ? -1 : 1)
  });
}

/* ---------- state ---------- */
let W = 0, H = 0, DPR = 1;
let spawned = false;        // nothing on screen until first tap
let mode = 'shape';         // 'shape' | 'drag'
let shape = null, pts = null, lastShape = -1;
let shapeScale = 100;
let baseHue = Math.random() * 360;
let snap = 0;               // elastic energy on release (boosts spring stiffness)
let t = 0;
const anchor = { x: 0, y: 0 };
const finger = { x: 0, y: 0 };
const ripples = [];

/* ---------- shape generators (unit space, then scaled) ---------- */
function ringPts(n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * TAU;
    out.push([Math.cos(a), Math.sin(a)]);
  }
  return out;
}

function heartPts(n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * TAU;
    const x = 16 * Math.pow(Math.sin(a), 3);
    const y = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a);
    out.push([x / 17, -y / 17]);
  }
  return out;
}

function starVerts() {
  const v = [];
  for (let k = 0; k < 10; k++) {
    const r = k % 2 ? 0.46 : 1;
    const a = -Math.PI / 2 + k * Math.PI / 5;
    v.push([Math.cos(a) * r, Math.sin(a) * r]);
  }
  return v;
}

function alongPolygon(verts, n) {   // n points spread evenly along a polygon outline
  const L = [];
  let T = 0;
  for (let i = 0; i < verts.length; i++) {
    const a = verts[i], b = verts[(i + 1) % verts.length];
    const d = Math.hypot(b[0] - a[0], b[1] - a[1]);
    L.push(d); T += d;
  }
  const out = [];
  for (let k = 0; k < n; k++) {
    let d = (k / n) * T, e = 0, acc = 0;
    while (e < L.length - 1 && d > acc + L[e]) { acc += L[e]; e++; }
    const a = verts[e], b = verts[(e + 1) % verts.length];
    const f = L[e] > 0 ? (d - acc) / L[e] : 0;
    out.push([a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]);
  }
  return out;
}

function galaxyPts(n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const arm = i % 3;
    const p = i / n;
    const r = 0.14 + 0.86 * Math.pow(p, 0.85);
    const a = arm * TAU / 3 + p * 5.2 + (Math.random() - 0.5) * 0.16;
    out.push([r * Math.cos(a), r * Math.sin(a)]);
  }
  return out;
}

function flowerPts(n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * TAU;
    const r = Math.cos(2 * a) * 0.95;
    out.push([r * Math.cos(a), r * Math.sin(a)]);
  }
  return out;
}

function butterflyPts(n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * 12 * Math.PI;
    const r = Math.exp(Math.sin(a)) - 2 * Math.cos(4 * a) + Math.pow(Math.sin((2 * a - Math.PI) / 24), 5);
    out.push([Math.sin(a) * r, -Math.cos(a) * r]);
  }
  return out;
}

function spherePts(n) {   // fibonacci sphere
  const out = [];
  for (let i = 0; i < n; i++) {
    const y = 1 - 2 * (i + 0.5) / n;
    const rr = Math.sqrt(Math.max(0, 1 - y * y));
    const a = i * 2.399963229728653;
    out.push([rr * Math.cos(a), y, rr * Math.sin(a)]);
  }
  return out;
}

function torusPts(n) {
  const R = 0.78, r = 0.36, out = [];
  for (let i = 0; i < n; i++) {
    const u = TAU * ((i * 0.618033988749895) % 1);
    const v = TAU * ((i * 0.7548776662466927) % 1);
    out.push([(R + r * Math.cos(v)) * Math.cos(u), r * Math.sin(v), (R + r * Math.cos(v)) * Math.sin(u)]);
  }
  return out;
}

function helixPts(n) {    // double helix
  const out = [];
  for (let i = 0; i < n; i++) {
    const strand = i % 2;
    const p = i / n;
    const a = p * 3 * TAU + strand * Math.PI;
    out.push([Math.cos(a) * 0.8, (p - 0.5) * 2.2, Math.sin(a) * 0.8]);
  }
  return out;
}

function cubePts(n) {     // points along the 12 edges
  const c = 0.85, verts = [];
  for (let sx = -1; sx <= 1; sx += 2)
    for (let sy = -1; sy <= 1; sy += 2)
      for (let sz = -1; sz <= 1; sz += 2)
        verts.push([sx * c, sy * c, sz * c]);
  const edges = [];
  for (let a = 0; a < 8; a++)
    for (let b = a + 1; b < 8; b++) {
      let diff = 0;
      for (let k = 0; k < 3; k++) if (verts[a][k] !== verts[b][k]) diff++;
      if (diff === 1) edges.push([verts[a], verts[b]]);
    }
  const out = [];
  const steps = Math.max(2, Math.ceil(n / 12));
  for (let i = 0; i < n; i++) {
    const e = edges[i % 12];
    const f = Math.floor(i / 12) / (steps - 1);
    out.push([
      e[0][0] + (e[1][0] - e[0][0]) * f,
      e[0][1] + (e[1][1] - e[0][1]) * f,
      e[0][2] + (e[1][2] - e[0][2]) * f
    ]);
  }
  return out;
}

const SHAPES = [
  { name: 'ring',      spin: 1, gen: n => ringPts(n) },
  { name: 'heart',     spin: 0, gen: n => heartPts(n) },
  { name: 'star',      spin: 1, gen: n => alongPolygon(starVerts(), n) },
  { name: 'galaxy',    spin: 1, gen: n => galaxyPts(n) },
  { name: 'flower',    spin: 1, gen: n => flowerPts(n) },
  { name: 'butterfly', spin: 0, gen: n => butterflyPts(n) },
  { name: 'sphere',    spin: 1, is3d: 1, gen: n => spherePts(n) },
  { name: 'torus',     spin: 1, is3d: 1, gen: n => torusPts(n) },
  { name: 'helix',     spin: 1, is3d: 1, gen: n => helixPts(n) },
  { name: 'cube',      spin: 1, is3d: 1, gen: n => cubePts(n) }
];

function newShape() {
  let i;
  do { i = (Math.random() * SHAPES.length) | 0; } while (i === lastShape);
  lastShape = i;
  shape = SHAPES[i];
  const raw = shape.gen(MAX);
  if (shape.is3d) {
    pts = raw;
  } else {
    let m = 1e-9;
    for (let k = 0; k < raw.length; k++) m = Math.max(m, Math.hypot(raw[k][0], raw[k][1]));
    pts = raw.map(p => [
      p[0] / m + (Math.random() - 0.5) * 0.02,
      p[1] / m + (Math.random() - 0.5) * 0.02
    ]);
  }
}

function clampAnchor() {
  const m = shapeScale * 0.55;
  anchor.x = Math.min(Math.max(anchor.x, m), Math.max(W - m, m));
  anchor.y = Math.min(Math.max(anchor.y, m), Math.max(H - m, m));
}

/* first tap: burst outward from the touch point, then springs pull into shape */
function summon(x, y) {
  anchor.x = x; anchor.y = y;
  newShape();
  clampAnchor();
  spawned = true;
  mode = 'shape';
  snap = 0;
  for (let i = 0; i < MAX; i++) {
    const p = parts[i];
    const a = Math.random() * TAU;
    const sp = 2.5 + Math.random() * 10;
    p.x = x + (Math.random() - 0.5) * 10;
    p.y = y + (Math.random() - 0.5) * 10;
    p.vx = Math.cos(a) * sp;
    p.vy = Math.sin(a) * sp;
    p.depth = 1;
  }
}

/* later taps: morph the living swarm into a new shape */
function morphTo(x, y) {
  anchor.x = x; anchor.y = y;
  newShape();
  clampAnchor();
  mode = 'shape';
  snap = 0.35;
  for (let i = 0; i < MAX; i++) {
    const p = parts[i];
    p.vx += (Math.random() - 0.5) * 4;
    p.vy += (Math.random() - 0.5) * 4;
  }
}

/* ---------- sizing ---------- */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  shapeScale = Math.min(W, H) * 0.31;
  if (spawned) clampAnchor();
}
window.addEventListener('resize', resize);
resize();

/* ---------- physics: spring toward target, fixed 60hz steps ---------- */
function step() {
  snap *= 0.93;
  const ax = anchor.x + Math.sin(t * 0.43) * 5;   // whole formation slowly breathes/drifts
  const ay = anchor.y + Math.sin(t * 0.31) * 6;
  const dragging = mode === 'drag';

  let cy = 1, sy = 0, cx = 1, sx = 0;
  if (!dragging && shape.is3d) {
    const ry = t * 0.55;                          // slow 3d spin
    const rx = 0.5 + 0.22 * Math.sin(t * 0.33);   // wobbling tilt
    cy = Math.cos(ry); sy = Math.sin(ry);
    cx = Math.cos(rx); sx = Math.sin(rx);
  }
  let c = 1, sn = 0, s2 = shapeScale;
  if (!dragging && !shape.is3d) {
    const ang = shape.spin ? t * 0.22 : Math.sin(t * 0.5) * 0.15;
    c = Math.cos(ang); sn = Math.sin(ang);
    s2 = shapeScale * (1 + 0.045 * Math.sin(t * 1.2));  // breathing scale
  }

  const K = dragging ? 0.010 : (0.016 + snap * 0.05);

  for (let i = 0; i < MAX; i++) {
    const p = parts[i];
    let tx, ty;
    if (dragging) {
      // swirl in a little vortex around the finger
      const oa = p.orbA + t * p.orbS * 2.6;
      tx = finger.x + Math.cos(oa) * p.orbR;
      ty = finger.y + Math.sin(oa) * p.orbR;
      p.depth = 1;
    } else if (shape.is3d) {
      const q = pts[i];
      const x1 = q[0] * cy + q[2] * sy;
      const z1 = -q[0] * sy + q[2] * cy;
      const y1 = q[1] * cx - z1 * sx;
      const z2 = q[1] * sx + z1 * cx;
      const pj = 3.4 / (3.4 - z2);               // perspective
      tx = ax + x1 * pj * shapeScale;
      ty = ay + y1 * pj * shapeScale;
      p.depth = pj;
    } else {
      const px = pts[i][0], py = pts[i][1];
      tx = ax + (px * c - py * sn) * s2;
      ty = ay + (px * sn + py * c) * s2;
      p.depth = 1;
    }
    // per-particle idle wobble keeps everything alive
    tx += Math.sin(t * p.wobF + p.wobP) * p.wobA;
    ty += Math.cos(t * p.wobF * 0.9 + p.wobP) * p.wobA;

    p.vx += (tx - p.x) * K;
    p.vy += (ty - p.y) * K;
    p.vx *= 0.90; p.vy *= 0.90;
    p.x += p.vx; p.y += p.vy;
  }
}

/* ---------- rendering: additive glow + motion-trail fade ---------- */
function draw() {
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(0,0,0,0.26)';
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';

  if (spawned) {
    for (let i = 0; i < MAX; i++) {
      const p = parts[i];
      const hue = (baseHue + p.hueOff) % 360;
      const si = (hue / 360 * SPRITE_N) | 0;
      const depth = Math.min(Math.max(p.depth, 0.6), 1.5);
      const r = p.size * (1 + 0.25 * Math.sin(t * 2.7 + p.pulse)) * 4.4 * depth;
      ctx.globalAlpha = (0.55 + 0.25 * Math.sin(t * 3.1 + p.pulse)) * Math.min(depth, 1.15);
      ctx.drawImage(sprites[si], p.x - r, p.y - r, r * 2, r * 2);
    }
    ctx.globalAlpha = 1;
  }

  for (let i = ripples.length - 1; i >= 0; i--) {
    const rp = ripples[i];
    const age = t - rp.t;
    if (age > 0.9) { ripples.splice(i, 1); continue; }
    const f = age / 0.9;
    ctx.strokeStyle = `hsla(${(rp.hue + 40) % 360},100%,70%,${((1 - f) * 0.45).toFixed(3)})`;
    ctx.lineWidth = 1.5 + (1 - f) * 2;
    ctx.beginPath();
    ctx.arc(rp.x, rp.y, 6 + f * 90, 0, TAU);
    ctx.stroke();
  }
}

/* ---------- input ---------- */
let ptrId = null, downX = 0, downY = 0, downT = 0, moved = false, existedBefore = false;

canvas.addEventListener('pointerdown', e => {
  if (ptrId !== null) return;
  ptrId = e.pointerId;
  try { if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId); } catch (_) {}
  existedBefore = spawned;
  moved = false;
  downX = finger.x = e.clientX;
  downY = finger.y = e.clientY;
  downT = performance.now();
  hint.style.opacity = '0';
  if (!spawned) {
    summon(e.clientX, e.clientY);
    ripples.push({ x: e.clientX, y: e.clientY, t: t, hue: baseHue });
  }
  mode = 'shape';
});

canvas.addEventListener('pointermove', e => {
  if (e.pointerId !== ptrId) return;
  finger.x = e.clientX; finger.y = e.clientY;
  if (!moved && Math.hypot(e.clientX - downX, e.clientY - downY) > 14) {
    moved = true;
    mode = 'drag';
    snap = 0;
  }
});

function release(e) {
  if (e.pointerId !== ptrId) return;
  ptrId = null;
  if (moved) {
    // dragged: short flick bounces home, a long carry re-anchors the formation
    const dist = Math.hypot(e.clientX - downX, e.clientY - downY);
    if (dist > 120) {
      anchor.x = e.clientX; anchor.y = e.clientY;
      clampAnchor();
      snap = 0.6;
      ripples.push({ x: e.clientX, y: e.clientY, t: t, hue: baseHue });
    } else {
      snap = 1;   // elastic snap-back
    }
    mode = 'shape';
  } else if (existedBefore && performance.now() - downT < 300) {
    // clean tap: morph into a fresh shape right here
    morphTo(e.clientX, e.clientY);
    ripples.push({ x: e.clientX, y: e.clientY, t: t, hue: baseHue });
  }
}
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- main loop ---------- */
let last = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = now - last;
  last = now;
  if (dt < 0) dt = 0;
  if (dt > 50) dt = 50;
  t += dt / 1000;
  baseHue = (baseHue + dt * 0.003) % 360;   // ~2min per full colour cycle
  if (spawned) {
    acc += dt;
    let n = 0;
    while (acc >= 16.7 && n < 3) { step(); acc -= 16.7; n++; }
    if (n === 3) acc = 0;
  }
  draw();
}
requestAnimationFrame(frame);
</script>
</body>
</html>
