name: build

on:
  push:
    branches-ignore: [gh-pages]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build playable game (Kotlin/JS)
        run: gradle --no-daemon :shared:jsBrowserProductionWebpack

      - name: Compile and run balance simulation (Kotlin/JVM)
        run: |
          set -x
          if gradle --no-daemon :shared:run; then
            echo "sim ran via gradle :shared:run"
          else
            echo "gradle run unavailable; falling back to compile + direct java"
            gradle --no-daemon :shared:compileKotlinJvm
            STDLIB=$(find "$HOME/.gradle" -name "kotlin-stdlib-2.1.20.jar" | head -n 1)
            echo "stdlib: $STDLIB"
            java -cp "shared/build/classes/kotlin/jvm/main:$STDLIB" lumen.SimKt
          fi

      - name: Stage web bundle
        run: |
          mkdir -p deploy
          cp web/index.html deploy/
          cp shared/build/dist/js/productionExecutable/*.js deploy/

      - name: Upload web bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutterlight-web
          path: deploy

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: deploy
