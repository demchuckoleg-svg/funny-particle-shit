name: build

on:
  push:
    branches-ignore: [gh-pages]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build playable game (Kotlin/JS)
        run: gradle --no-daemon :shared:jsBrowserProductionWebpack

      - name: Compile and run balance simulation (Kotlin/JVM)
        run: |
          set -x
          curl -fL --retry 3 --max-time 180 -o kotlin-compiler.jar https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-compiler/2.1.20/kotlin-compiler-2.1.20.jar
          curl -fL --retry 3 --max-time 120 -o kotlin-stdlib.jar https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.1.20/kotlin-stdlib-2.1.20.jar
          curl -fL --retry 3 --max-time 120 -o kotlin-reflect.jar https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-reflect/2.1.20/kotlin-reflect-2.1.20.jar
          curl -fL --retry 3 --max-time 120 -o kotlinx-coroutines-core-jvm.jar https://repo1.maven.org/maven2/org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/1.8.0/kotlinx-coroutines-core-jvm-1.8.0.jar
          curl -fL --retry 3 --max-time 120 -o kotlin-script-runtime.jar https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-script-runtime/2.1.20/kotlin-script-runtime-2.1.20.jar
          curl -fL --retry 3 --max-time 120 -o trove4j.jar https://repo1.maven.org/maven2/org/jetbrains/intellij/deps/trove4j/1.0.20200330/trove4j-1.0.20200330.jar
          ls -la *.jar
          java -Xmx2g -cp "kotlin-compiler.jar:kotlin-stdlib.jar:kotlin-reflect.jar:kotlinx-coroutines-core-jvm.jar:kotlin-script-runtime.jar:trove4j.jar" org.jetbrains.kotlin.cli.jvm.K2JVMCompiler \
            shared/src/commonMain/kotlin/lumen/logic.kt shared/src/jvmMain/kotlin/lumen/sim.kt \
            -include-runtime -d sim.jar
          ls -la sim.jar
          java -jar sim.jar

      - name: Stage web bundle
        run: |
          mkdir -p deploy
          cp web/index.html deploy/
          cp shared/build/dist/js/productionExecutable/*.js deploy/

      - name: Upload web bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutterlight-web
          path: deploy

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: deploy
