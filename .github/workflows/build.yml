name: build

on:
  push:
    branches-ignore: [gh-pages]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build playable game (Kotlin/JS)
        run: gradle --no-daemon :shared:jsBrowserProductionWebpack

      - name: Compile and run balance simulation (Kotlin/JVM)
        run: |
          curl -sL -o kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v2.1.20/kotlin-compiler-2.1.20.zip
          unzip -q kotlinc.zip
          kotlinc/bin/kotlinc shared/src/commonMain/kotlin/lumen/logic.kt shared/src/jvmMain/kotlin/lumen/sim.kt -include-runtime -d sim.jar
          java -jar sim.jar

      - name: Stage web bundle
        run: |
          mkdir -p deploy
          cp web/index.html deploy/
          cp shared/build/dist/js/productionExecutable/*.js deploy/

      - name: Upload web bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutterlight-web
          path: deploy

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: deploy
